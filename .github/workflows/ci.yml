name: Cross-Platform CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        qt_version: [6.8.2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC (Windows only)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Linux Dependencies (Ubuntu only)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev libxcb-cursor0 file

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}
        arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || '' }}

    - name: Patch macOS Qt headers and dependencies (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        find "$RUNNER_WORKSPACE" -type f \( -name "*.prl" -o -name "*.pri" -o -name "*.prf" -o -name "*.conf" \) -exec sed -i '' 's/-framework AGL//g' {} + 2>/dev/null || true
        find "$RUNNER_WORKSPACE" -name "qyieldcpu.h" -exec sed -i '' 's/__yield()/__builtin_arm_yield()/g' {} + 2>/dev/null || true

    - name: Build Main Application
      run: |
        lrelease boncuk.pro
        qmake "CONFIG-=debug" "CONFIG+=release" "DEFINES+=QT_NO_DEBUG_OUTPUT" boncuk.pro
        ${{ matrix.os == 'windows-latest' && 'nmake' || 'make' }}

    - name: Build and Run Tests (Windows)
      if: matrix.os == 'windows-latest'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        cd tests\sqlite
        qmake "CONFIG-=debug" "CONFIG+=release" "DEFINES+=QT_NO_DEBUG_OUTPUT" sqlite.pro
        nmake
        windeployqt --no-translations release\test_sqlite.exe
        .\release\test_sqlite.exe

    - name: Build and Run Tests (Unix)
      if: matrix.os != 'windows-latest'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        cd tests/sqlite
        qmake "CONFIG-=debug" "CONFIG+=release" "DEFINES+=QT_NO_DEBUG_OUTPUT" sqlite.pro
        make
        ./test_sqlite

    - name: Package Windows Installer
      if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $exePath = Get-ChildItem -Path bin -Filter boncuk.exe -Recurse | Select-Object -First 1
        if ($exePath -and $exePath.FullName -ne (Resolve-Path "bin\boncuk.exe" -ErrorAction SilentlyContinue).Path) {
          Copy-Item $exePath.FullName bin\boncuk.exe -ErrorAction SilentlyContinue
        }
        windeployqt bin\boncuk.exe
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\boncuk.iss
      
    - name: Package macOS DMG
      if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
      run: |
        macdeployqt bin/boncuk.app
        codesign --force --deep --sign - bin/boncuk.app
        hdiutil create -volname Boncuk -srcfolder bin/boncuk.app -ov -format UDZO bin/boncuk.dmg
      
    - name: Package Linux AppImage
      if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
      env:
        QMAKE: qmake
      run: |
        # Remove unused SQL plugins with missing third-party libs (e.g. Mimer)
        find "$RUNNER_WORKSPACE" -name "libqsqlmimer.so" -delete 2>/dev/null || true

        # Download linuxdeploy and plugins
        wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
        wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
        chmod a+x linuxdeploy*.AppImage
        
        # Build AppImage with Qt plugin and AppImage output
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --executable bin/boncuk \
          --desktop-file linux/boncuk.desktop \
          --icon-file resources/boncuk.png \
          --plugin qt \
          --output appimage

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: Boncuk-Windows-Installer
        path: dist/Boncuk_Setup.exe
        
    - name: Upload macOS Artifact
      if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: Boncuk-macOS-DMG
        path: bin/boncuk.dmg

    - name: Upload Linux Artifact
      if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: Boncuk-Linux-AppImage
        path: Boncuk*.AppImage

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
